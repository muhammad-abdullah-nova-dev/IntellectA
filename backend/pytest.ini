[pytest]
pythonpath = src
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    auth: Module 1 - authentication and user repository
    assessment: Module 2 - adaptive assessment engine
    memory: Module 3 - short-term session memory
    smoke: quick sanity tests
    regression: full suite
    slow: tests that wait for real time to pass
    bva: boundary value tests
    data_driven: tests that read their data from a CSV file
    security: tests about bad or unsafe input
